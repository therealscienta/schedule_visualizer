services:
  schedule-visualiser:
    image: therealscienta/schedule_visualizer:latest
    container_name: schedule_visualizer
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # Required: compose refuses to start without it (set it in .env next to this file)
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET to a long random value, e.g. in .env}
      - DB_PATH=/app/data/schedules.db
    restart: unless-stopped
